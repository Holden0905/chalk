name: snapshot

# Capture times are NFL kickoff slots in Eastern, expressed in UTC.
# While EDT is in effect (UTC-4) they line up as:
#   14:17 UTC daily      -> 10:17 AM ET  baseline capture
#   Thu 23:49 UTC        -> Thu  7:49 PM ET  (TNF, 8:15 kickoff)
#   Sun 16:19 UTC        -> Sun 12:19 PM ET  (early slate, 1:00 kickoff)
#   Sun 19:49 UTC        -> Sun  3:49 PM ET  (late afternoon slate, 4:05/4:25)
#   Sun 23:49 UTC        -> Sun  7:49 PM ET  (SNF, 8:20 kickoff)
#   Mon 23:49 UTC        -> Mon  7:49 PM ET  (MNF, 8:15 kickoff)
#
# Nothing here runs on the hour. GitHub queues scheduled runs across all of
# GitHub and :00 is by far the most contended minute, so an on-the-hour job is
# the likeliest to be delayed or skipped outright -- and a skipped slot is not
# backfilled.
#
# The five capture slots each sit a few minutes earlier than the kickoff slot
# they are named for, which buys margin in the same move: a capture that lands
# late is worth less than one that lands early, because the line only stops
# being the closing line once the ball is kicked. Between 16 and 41 minutes of
# room, depending on the slot.
#
# NOTE ON THE DAY FIELD. Three of these used to be midnight UTC and are now
# 23:49 the day before, so their day-of-week moved back one as well:
#   TNF  Fri 00:00 -> Thu 23:49   (cron day 5 -> 4)
#   SNF  Mon 00:00 -> Sun 23:49   (cron day 1 -> 0)
#   MNF  Tue 00:00 -> Mon 23:49   (cron day 2 -> 1)
# Editing the time without the day would have left them firing a full day late.
#
# DST ends Sun Nov 1 2026, when ET becomes EST (UTC-5). Cron here is fixed to
# UTC, so from that date every slot lands one hour EARLIER in ET -- the Sunday
# early capture becomes 11:19 AM ET, roughly 100 minutes before a 1:00 PM
# kickoff instead of 41. Shift these expressions forward an hour if the captures
# need to stay tight to kickoff through the end of the season.
on:
  schedule:
    - cron: '17 14 * * *'  # daily baseline
    - cron: '49 23 * * 4'  # Thu 7:49 PM ET, 26 min before a TNF kickoff
    - cron: '19 16 * * 0'  # Sun 12:19 PM ET, 41 min before the early slate
    - cron: '49 19 * * 0'  # Sun 3:49 PM ET, 16 min before the late slate
    - cron: '49 23 * * 0'  # Sun 7:49 PM ET, 31 min before an SNF kickoff
    - cron: '49 23 * * 1'  # Mon 7:49 PM ET, 26 min before an MNF kickoff
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
