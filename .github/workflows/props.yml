name: props

# Saturday 14:37 UTC (10:37 AM ET while EDT is in effect, 9:37 AM once DST ends
# Sun Nov 1 2026), which catches anytime-TD prices for the Sunday and Monday
# slate the day before kickoff. The events endpoint is free, so the cost is one
# API credit per game with a market.
#
# Sunday 14:37 UTC runs the context capture a second time and nothing else. The
# Saturday injury report is stale by Sunday morning: the game-day actives, and
# the Saturday night downgrades that move a number most, land in between. Props
# are deliberately skipped on that run, because those cost API credits and the
# prices barely move overnight.
#
# Neither is on the hour. GitHub queues scheduled runs league-wide and :00 is
# the most contended minute, so an on-the-hour job is the likeliest to be
# delayed. Nothing here is timed against a kickoff, so the minute is free.
on:
  schedule:
    - cron: '37 14 * * 6'  # Saturday: props, then context
    - cron: '37 14 * * 0'  # Sunday: context only
  workflow_dispatch:

jobs:
  props:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Skipped on the Sunday schedule only. A manual dispatch leaves
      # github.event.schedule empty, so dispatching still captures prices.
      - name: Anytime-TD prices
        if: github.event.schedule != '37 14 * * 0'
        run: npm run snapshot:props
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Injury report and per-game news from ESPN. No key, no credits, so this
      # runs on both schedules.
      - name: Injuries and game news
        run: npm run snapshot:context
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
